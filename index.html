<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/unRing.png" />
  <title>unRing</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d0d0d;
      color: #e0e0e0;
      font-family: system-ui, sans-serif;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      border-bottom: 1px solid #222;
      flex-shrink: 0;
    }

    header h1 {
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: #fff;
    }

    #upload-btn {
      background: #1a73e8;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 7px 16px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: background 0.15s;
    }

    #upload-btn:hover { background: #1558b0; }

    header .header-btn {
      background: #2a2a2a;
      color: #ccc;
      border: 1px solid #444;
      border-radius: 6px;
      padding: 7px 14px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }

    header .header-btn:hover { background: #333; }

    #file-input { display: none; }

    #filename {
      font-size: 0.8rem;
      color: #888;
      max-width: 300px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #renderer-status {
      font-size: 0.72rem;
      color: #d9a441;
      white-space: nowrap;
    }

    #viewport {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    #canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #drop-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: #0d0d0d;
      pointer-events: none;
      transition: opacity 0.2s;
      z-index: 10;
    }

    #drop-overlay.hidden { opacity: 0; pointer-events: none; }

    #drop-overlay svg { opacity: 0.3; }

    #drop-overlay p {
      color: #555;
      font-size: 0.95rem;
      pointer-events: none;
    }

    #drop-overlay p span {
      color: #1a73e8;
      cursor: pointer;
      pointer-events: all;
    }

    /* drag-over highlight */
    body.drag-over #drop-overlay {
      background: rgba(13, 13, 13, 0.92);
    }

    body.drag-over #drop-overlay svg { opacity: 0.6; }

    /* ── Layout: viewport + sidebar ── */
    #main-area {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    #viewport {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    /* ── Sidebar ── */
    #sidebar {
      width: 260px;
      flex-shrink: 0;
      background: #111;
      border-left: 1px solid #222;
      display: flex;
      flex-direction: column;
      gap: 0;
      overflow-y: auto;
    }

    .sidebar-section {
      padding: 14px 16px;
      border-bottom: 1px solid #1e1e1e;
    }

    .sidebar-section h2 {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #555;
      margin-bottom: 10px;
    }

    /* Source monitor */
    #source-monitor {
      width: 100%;
      aspect-ratio: 1;
      background: #000;
      border-radius: 4px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #source-monitor video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* Sliders */
    .slider-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 10px;
    }

    .slider-row:last-child { margin-bottom: 0; }

    .slider-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.78rem;
      color: #aaa;
    }

    .slider-label span { color: #fff; font-variant-numeric: tabular-nums; }

    input[type=range] {
      width: 100%;
      accent-color: #1a73e8;
      cursor: pointer;
    }

    .slider-control {
      display: grid;
      grid-template-columns: 28px 1fr 28px 28px;
      gap: 5px;
      align-items: center;
    }

    .slider-control button {
      height: 24px;
      padding: 0;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 4px;
      color: #ccc;
      cursor: pointer;
      font-size: 0.9rem;
      line-height: 1;
    }

    .slider-control button:hover { background: #2a2a2a; }
    .slider-control .slider-reset { font-size: 1rem; }

    /* Transport controls */
    #transport {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 48px;
      padding: 8px 12px;
      background: rgba(17, 17, 17, 0.94);
      border-top: 1px solid #2a2a2a;
    }

    #transport button {
      background: none;
      border: 1px solid #333;
      color: #ccc;
      border-radius: 5px;
      padding: 6px 10px;
      font-size: 0.82rem;
      cursor: pointer;
      transition: background 0.12s;
    }

    #transport button:hover { background: #1e1e1e; }

    #seek {
      width: 100%;
      accent-color: #1a73e8;
      cursor: pointer;
    }

    #seek-track {
      position: relative;
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
    }

    .scrub-marker {
      position: absolute;
      top: 1px;
      bottom: 1px;
      width: 3px;
      border-radius: 2px;
      pointer-events: none;
      z-index: 1;
      transform: translateX(-50%);
      display: none;
    }

    .scrub-marker.visible { display: block; }
    #mark-in-marker { background: #22c55e; }
    #mark-out-marker { background: #ef4444; }

    #time-label {
      font-size: 0.75rem;
      color: #666;
      white-space: nowrap;
      min-width: 80px;
      text-align: right;
    }

    /* Compact volume control stays beside the scrub bar. */
    #volume-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 0 0 120px;
    }

    #volume-row label { font-size: 0.78rem; color: #aaa; white-space: nowrap; }

    #vol-slider { flex: 1; accent-color: #1a73e8; cursor: pointer; }

    /* Export section */
    .full-btn {
      display: block;
      width: 100%;
      background: #1e1e1e;
      border: 1px solid #333;
      color: #ccc;
      border-radius: 5px;
      padding: 7px 10px;
      font-size: 0.8rem;
      cursor: pointer;
      text-align: center;
      transition: background 0.12s;
      margin-bottom: 8px;
    }
    .full-btn:hover:not(:disabled) { background: #2a2a2a; }
    .full-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .full-btn.primary {
      background: #1a73e8;
      border-color: #1a73e8;
      color: #fff;
    }
    .full-btn.primary:hover:not(:disabled) { background: #1558b0; }
    .full-btn.highlighted {
      box-shadow: 0 0 0 2px rgba(26, 115, 232, 0.35);
      font-weight: 600;
    }
    .full-btn.highlighted:disabled {
      opacity: 0.7;
    }

    .straightness-label {
      font-size: 11px;
      font-weight: 600;
      paint-order: stroke;
      stroke: #111;
      stroke-width: 3px;
      stroke-linejoin: round;
    }

    .marker-grid {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 5px 8px;
      align-items: center;
      margin-bottom: 8px;
    }
    .marker-grid button {
      background: #1a1a1a;
      border: 1px solid #333;
      color: #ccc;
      border-radius: 5px;
      padding: 5px 8px;
      font-size: 0.78rem;
      cursor: pointer;
      transition: background 0.12s;
    }
    .marker-grid button:hover { background: #2a2a2a; }
    .marker-grid button.set { border-color: #1a73e8; color: #6ab0ff; }
    .marker-time {
      font-size: 0.75rem;
      color: #555;
      font-variant-numeric: tabular-nums;
      text-align: right;
    }
    .marker-time.set { color: #6ab0ff; }

    #export-progress { margin-top: 6px; }
    #export-bar {
      width: 100%;
      height: 6px;
      accent-color: #1a73e8;
      display: block;
      margin-bottom: 4px;
    }
    #export-status {
      font-size: 0.72rem;
      color: #666;
    }

    /* ── Overlay Tools ── */
    .tp-title {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #555;
      margin-bottom: 2px;
    }
    .tp-sep { border: none; border-top: 1px solid #252525; margin: 2px 0; }

    .tool-create-btn {
      background: #222;
      border: 1px solid #3a3a3a;
      color: #bbb;
      border-radius: 5px;
      padding: 7px 10px;
      font-size: 0.82rem;
      cursor: pointer;
      text-align: left;
      transition: background 0.12s;
    }
    .tool-create-btn:hover { background: #2c2c2c; }
    .tool-create-btn.active-mode {
      background: #1a3a5c;
      border-color: #1a73e8;
      color: #6ab0ff;
    }
    .tool-create-btn svg {
      width: 16px;
      height: 16px;
      margin-right: 4px;
      vertical-align: -3px;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 2;
    }
    .tool-create-btn svg .point { fill: currentColor; stroke: none; }

    .tp-tool-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
    }
    .tp-tool-row .tool-create-btn { flex: 1; }
    #tool-three-point-line-btn {
      background: #1a73e8;
      border-color: #1a73e8;
      color: #fff;
    }
    #tool-three-point-line-btn:hover { background: #1558b0; }
    .tp-tool-row input[type=color] {
      width: 28px;
      height: 28px;
      padding: 2px;
      border: 1px solid #444;
      border-radius: 4px;
      cursor: pointer;
      flex-shrink: 0;
      background: #222;
    }
    .tp-tool-row input[type=color]::-webkit-color-swatch-wrapper { padding: 1px; }
    .tp-tool-row input[type=color]::-webkit-color-swatch { border-radius: 2px; border: none; }

    /* SVG overlay over the viewport */
    #overlay-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 20;
      overflow: visible;
    }
  </style>
</head>
<body>

  <header>
    <h1>unRing</h1>
    <button id="upload-btn">Open File</button>
    <button class="header-btn" id="import-settings-btn">Import Settings</button>
    <input type="file" id="file-input" accept="image/jpeg,image/png,image/webp,image/gif,image/bmp,.jpg,.jpeg,.png,.webp,.gif,.bmp,.tiff,.tif" multiple />
    <input type="file" id="settings-input" accept=".json" style="display:none;" />
    <span id="filename">No file loaded</span>
    <span id="renderer-status" aria-live="polite"></span>
  </header>

  <div id="main-area">
    <div id="viewport">
      <canvas id="canvas"></canvas>
      <svg id="overlay-svg"></svg>

      <div id="drop-overlay">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.2">
          <circle cx="12" cy="12" r="10"/>
          <path d="M12 8v8M8 12l4-4 4 4"/>
        </svg>
        <p>Drop a file here, or <span id="drop-open">click to open</span></p>
        <p style="font-size:0.78rem; color:#444;">.jpg &nbsp;·&nbsp; .png &nbsp;·&nbsp; .webp &nbsp;·&nbsp; .gif &nbsp;(or multiple images as a sequence)</p>
      </div>

      <div id="transport">
        <button id="play-pause-btn">▶</button>
        <div id="seek-track">
          <input type="range" id="seek" min="0" max="1000" value="0" step="1" />
          <span id="mark-in-marker" class="scrub-marker" title="Mark In"></span>
          <span id="mark-out-marker" class="scrub-marker" title="Mark Out"></span>
        </div>
        <span id="time-label">0:00 / 0:00</span>
        <div id="volume-row">
          <label>Vol</label>
          <input type="range" id="vol-slider" min="0" max="1" step="0.01" value="0" />
        </div>
      </div>
    </div>

    <!-- ── Sidebar ── -->
    <aside id="sidebar">

      <!-- Source Monitor -->
      <div class="sidebar-section">
        <h2>Source (Raw)</h2>
        <div id="source-monitor">
          <!-- video mirror populated by JS -->
        </div>
      </div>

      <!-- Lens Calibration -->
      <div class="sidebar-section">
        <h2>Lens Calibration</h2>

        <div class="slider-row" data-slider="src-fov" data-default="180">
          <div class="slider-label">Source FOV <span id="src-fov-val">180°</span></div>
          <div class="slider-control">
            <button type="button" class="slider-step" data-direction="-1" aria-label="Decrease Source FOV">−</button>
            <input type="range" id="src-fov" min="90" max="240" step="any" value="180" />
            <button type="button" class="slider-step" data-direction="1" aria-label="Increase Source FOV">+</button>
            <button type="button" class="slider-reset" aria-label="Reset Source FOV" title="Reset Source FOV">↶</button>
          </div>
        </div>

        <div class="slider-row" data-slider="zoom" data-default="75">
          <div class="slider-label">Virtual Zoom (FOV) <span id="zoom-val">75°</span></div>
          <div class="slider-control">
            <button type="button" class="slider-step" data-direction="-1" aria-label="Decrease Virtual Zoom">−</button>
            <input type="range" id="zoom" min="20" max="120" step="any" value="75" />
            <button type="button" class="slider-step" data-direction="1" aria-label="Increase Virtual Zoom">+</button>
            <button type="button" class="slider-reset" aria-label="Reset Virtual Zoom" title="Reset Virtual Zoom">↶</button>
          </div>
        </div>

        <div class="slider-row" data-slider="tilt" data-default="0">
          <div class="slider-label">Tilt <span id="tilt-val">0°</span></div>
          <div class="slider-control">
            <button type="button" class="slider-step" data-direction="-1" aria-label="Decrease Tilt">−</button>
            <input type="range" id="tilt" min="-45" max="45" step="any" value="0" />
            <button type="button" class="slider-step" data-direction="1" aria-label="Increase Tilt">+</button>
            <button type="button" class="slider-reset" aria-label="Reset Tilt" title="Reset Tilt">↶</button>
          </div>
        </div>

        <div class="slider-row" data-slider="pitch" data-default="0">
          <div class="slider-label">Pitch <span id="pitch-val">0°</span></div>
          <div class="slider-control">
            <button type="button" class="slider-step" data-direction="-1" aria-label="Decrease Pitch">−</button>
            <input type="range" id="pitch" min="-45" max="45" step="any" value="0" />
            <button type="button" class="slider-step" data-direction="1" aria-label="Increase Pitch">+</button>
            <button type="button" class="slider-reset" aria-label="Reset Pitch" title="Reset Pitch">↶</button>
          </div>
        </div>

        <div class="slider-row" data-slider="roll" data-default="0">
          <div class="slider-label">Roll <span id="roll-val">0°</span></div>
          <div class="slider-control">
            <button type="button" class="slider-step" data-direction="-1" aria-label="Decrease Roll">−</button>
            <input type="range" id="roll" min="-45" max="45" step="any" value="0" />
            <button type="button" class="slider-step" data-direction="1" aria-label="Increase Roll">+</button>
            <button type="button" class="slider-reset" aria-label="Reset Roll" title="Reset Roll">↶</button>
          </div>
        </div>
      </div>

      <!-- Overlay Tools -->
      <div id="tools-panel" class="sidebar-section">
        <h2>Overlay Tools</h2>
        <div class="tp-tool-row">
          <button class="tool-create-btn" id="tool-three-point-line-btn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 15 12 9 20 15" /><circle class="point" cx="4" cy="15" r="2" /><circle class="point" cx="12" cy="9" r="2" /><circle class="point" cx="20" cy="15" r="2" /></svg>Add 3-Point Line</button>
          <input type="color" id="three-point-line-color" value="#4ade80" title="Three-point line color">
        </div>
        <button class="full-btn primary" id="optimize-fov-btn" title="Add 2 or more lines to enable automatic optimization of source FOV." disabled>Optimize Source FOV</button>
      </div>

      <!-- Export -->
      <div class="sidebar-section">
        <h2>Export</h2>

        <button class="full-btn primary" id="save-still-btn" disabled>Export Image (PNG)</button>
        <button class="full-btn primary" id="export-settings-btn" disabled>Export Settings</button>
        <button class="full-btn primary highlighted" id="export-sequence-btn" disabled>Export Image Sequence</button>

        <div id="export-progress" hidden>
          <progress id="export-bar" max="100" value="0"></progress>
          <span id="export-status"></span>
        </div>
      </div>

    </aside>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
